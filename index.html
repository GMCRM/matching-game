<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balance of Nature Memory Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-container">
      <header>
        <h1>Balance of Nature Memory Game</h1>
        <div class="rules">
          <h2 class="rules-title">🎯 How to Earn Flips</h2>
          <ul class="rules-list">
            <li>
              <span class="rule-highlight">Account Reviewed</span> — earn
              <strong>2 card flips</strong>
            </li>
            <li>
              <span class="rule-highlight">Successful Contact</span> — earn
              <strong>4 card flips!</strong>
            </li>
          </ul>
          <p class="rules-goal">Find all matching pairs to win the game!</p>
        </div>
      </header>
      <div class="board-area">
        <aside class="match-counter attempts-counter">
          <div class="match-counter-icon">🔄</div>
          <div class="match-label">Card Flips</div>
          <div class="match-score">
            <span id="attemptCount">0</span>
          </div>
          <div class="match-progress-wrap">
            <div class="attempts-progress-bar" id="attemptsProgressBar"></div>
          </div>
        </aside>
        <div class="game-board" id="gameBoard"></div>
        <aside class="match-counter">
          <div class="match-counter-icon">🎯</div>
          <div class="match-label">Matches</div>
          <div class="match-score">
            <span id="matchCount">0</span>
            <span class="match-divider">of</span>
            <span id="totalPairs">0</span>
          </div>
          <div class="match-progress-wrap">
            <div class="match-progress-bar" id="matchProgressBar"></div>
          </div>
        </aside>
      </div>
      <button id="restartButton" class="restart-button">
        &#8635; Restart Game
      </button>
      <div id="winNotification" class="win-notification">🎉 YOU WIN! 🎉</div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
